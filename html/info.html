<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre as Eleições 2026.">
    <meta name="keywords" content="html, desenvolvimento web">
    <meta name="author" content="Luan Henrique">

    <title>Eleições 2026</title>
</head>

<body>
    <h1>Eleições 2026.</h1>
    <hr>

    <h2>Decisão Final</h2>
    <img src="../img/Urna_Eletronica.jpg" alt="Urna" width="350" height="300">

    <p>
        Depois de conhecer um pouco sobre cada candidato, qual deles você
        considera mais alinhado às suas opiniões? Escolha uma opção e,
        se quiser, compartilhe sua opinião sobre as propostas apresentadas.
    </p>

    <hr>

    <form>

        <label for="nome">Seu nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <br><br>

        <label for="candidato">Qual candidato você considera?</label>
        <select id="candidato" name="candidato" required>
            <option value="">Selecione uma opção</option>
            <option value="lula">Lula</option>
            <option value="flavio">Flávio Bolsonaro</option>
            <option value="cury">Augusto Cury</option>
        </select>

        <br><br>

        <label for="data">Data da resposta:</label>
        <input type="date" id="data" name="data" required>

        <br><br>

        <label for="opiniao">Qual sua opinião sobre as propostas?</label>
        <br>
        <textarea id="opiniao" name="opiniao" placeholder="Escreva sua opinião aqui..." rows="5" cols="40"
            required></textarea>

        <br><br>

        <label for="interesse">Quanto você se interessa pelas eleições?</label>
        <br>

        <input type="range" id="interesse" name="interesse" min="0" max="10" value="5">

        <br>

        <label for="arquivo">Envie um arquivo:</label>
        <input type="file" id="arquivo" name="arquivo">

        <br><br>

        <label for="tema">Qual tema mais chamou sua atenção?</label>
        <input list="temas" id="tema" name="tema" placeholder="Digite ou escolha um tema" required>

        <datalist id="temas">
            <option value="Economia">
            <option value="Saúde">
            <option value="Educação">
            <option value="Segurança">
            <option value="Tecnologia">
        </datalist>

        <br><br>

        <button type="submit">Enviar resposta</button>

    </form>

    <hr>
    <a href="Augusto.html">← Página anterior</a>
    <a href="index.html">Página Inicial</a>

    <hr>

    <time datetime="2026-09-28">
</body>

</html>
